---
Name: app-security-headers
After:
  - '#requestprocessors'
---
# Front-end security headers; see App\Middleware\SecurityHeadersMiddleware.
# The Content-Security-Policy is report-only until csp_enforce: true.
SilverStripe\Core\Injector\Injector:
  SilverStripe\Control\Director:
    properties:
      Middlewares:
        SecurityHeadersMiddleware: '%$App\Middleware\SecurityHeadersMiddleware'
