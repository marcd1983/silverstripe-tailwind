---
Name: app-cookieconsent
After:
  - '#cookieconsent'
---
# Cookie groups visitors can accept in the banner. Scripts in Settings >
# Scripts and map embeds (store-location) are tied to one of these and only
# load once it's accepted. Keys under each group: "local" for cookies on this
# domain, or a provider host with dots as underscores (e.g. google_com).
# Group titles/descriptions are edited in Settings > Cookie Consent.
Innoweb\CookieConsent\CookieConsent:
  cookies:
    Analytics:
      local:
        - _ga
        - _ga_*
        - _gid
    Marketing:
      local:
        - _fbp
        - _gcl_au
    External:
      google_com:
        - NID
        - AEC
